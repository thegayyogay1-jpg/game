<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game Party</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; text-align: center; padding: 20px; }
        .box { background: #333; padding: 20px; border-radius: 8px; max-width: 450px; margin: 20px auto; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
        button { cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 4px; }
        button:hover { background: #ff6b81; }
        .card { display: inline-block; background: #fff; color: #000; padding: 15px; margin: 5px; border-radius: 5px; width: 100px; }
        .target-card { background: #444; border: 2px solid #555; padding: 10px; margin: 5px; border-radius: 5px; display: inline-block; }
        .flashing { border: 2px dashed #ffa502 !important; animation: glow 0.8s infinite alternate; cursor: pointer; }
        @keyframes glow { from { border-color: #ffa502; box-shadow: 0 0 5px #ffa502; } to { border-color: #ff4757; box-shadow: 0 0 15px #ff4757; } }
        .hidden { display: none; }
        #modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #222; padding: 30px; border-radius: 10px; border: 2px solid #ff4757; width: 350px; text-align: center; }
    </style>
</head>
<body>

    <h1>🃏 เกมการ์ดปาร์ตี้</h1>

    <!-- หน้าแรก: ใส่ชื่อและสร้าง/เข้าห้อง (กดแล้วเด้งเข้าทันที) -->
    <div id="lobby-screen" class="box">
        <h3>เข้าสู่เกม</h3>
        <input type="text" id="playerName" placeholder="ชื่อของคุณ"><br>
        <input type="text" id="roomCode" placeholder="รหัสห้อง (เช่น 1234)"><br>
        <button onclick="createRoom()">สร้างห้อง</button>
        <button onclick="joinRoom()">เข้าห้อง</button>
    </div>

    <!-- หน้าห้องรอ -->
    <div id="waiting-screen" class="box hidden">
        <h3 id="room-title">ห้อง: -</h3>
        <p>รายชื่อผู้เล่นในห้อง:</p>
        <ul id="player-list" style="list-style: none; padding: 0;"></ul>
        <button id="start-btn" class="hidden" onclick="startGame()">เริ่มเกม</button>
    </div>

    <!-- หน้าจอเล่นเกม -->
    <div id="game-screen" class="hidden">
        <h2 id="turn-info">ตาของใครบางคน</h2>
        <div class="box">
            <h3>สถานะของคุณ</h3>
            <p>HP: <span id="my-hp">100</span> | Energy: <span id="my-energy">5</span></p>
        </div>

        <div class="box">
            <h3>การ์ดในมือ (สูงสุด 3 ใบ)</h3>
            <button onclick="drawCard()">จั่วการ์ด (ใช้ 1 Energy)</button>
            <div id="hand-cards"></div>
        </div>

        <div class="box">
            <h3>ผู้เล่นคนอื่น (คลิกที่เป้าหมายเพื่อโจมตี - ใช้ 3 Energy)</h3>
            <div id="target-list"></div>
        </div>

        <button onclick="endTurn()" style="background: #2ed573;">จบเทิร์น</button>
    </div>

    <!-- ป๊อปอัพกลางจอ (สำหรับแจ้งเตือน / ป้องกัน / ทอยเต๋า) -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-content" id="modal-body">
            <!-- เนื้อหาป๊อปอัพจะเปลี่ยนไปตามสถานการณ์ -->
        </div>
    </div>

    <script>
        const socket = io();
        let myId = '';
        let currentRoomData = null;
        let selectedCardIndexForAttack = null;

        socket.on('connect', () => { myId = socket.id; });
        socket.on('error_message', (msg) => { alert(msg); });

        function createRoom() {
            const name = document.getElementById('playerName').value;
            const code = document.getElementById('roomCode').value;
            if(!name || !code) return alert('กรุณากรอกชื่อและรหัสห้อง');
            socket.emit('create_room', { roomCode: code, playerName: name });
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value;
            const code = document.getElementById('roomCode').value;
            if(!name || !code) return alert('กรุณากรอกชื่อและรหัสห้อง');
            socket.emit('join_room', { roomCode: code, playerName: name });
        }

        // เมื่อสร้างหรือเข้าห้องสำเร็จ เด้งเข้าห้องรอทันที
        socket.on('room_joined', (room) => {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.remove('hidden');
            document.getElementById('room-title').innerText = `ห้อง: ${document.getElementById('roomCode').value}`;
            
            // ถ้าเป็นคนสร้างห้อง ให้โชว์ปุ่มเริ่มเกม
            if (room.host === myId) {
                document.getElementById('start-btn').classList.remove('hidden');
            }
        });

        socket.on('update_room', (room) => {
            currentRoomData = room;
            updateWaitingRoom(room);
            if(room.gameStarted) {
                updateGameUI(room);
            }
        });

        function updateWaitingRoom(room) {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            room.players.forEach(p => {
                list.innerHTML += `<li>👤 ${p.name} ${p.id === room.host ? '(Host)' : ''}</li>`;
            });
        }

        function startGame() { socket.emit('start_game'); }

        socket.on('game_started', (room) => {
            document.getElementById('waiting-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            updateGameUI(room);
        });

        function drawCard() { socket.emit('draw_card'); }
        function endTurn() { socket.emit('end_turn'); }

        // เลือกการ์ดในมือเพื่อเตรียมโจมตี
        function selectCardToAttack(index) {
            const currentTurnPlayer = currentRoomData.players[currentRoomData.currentTurnIndex];
            if(currentTurnPlayer.id !== myId) {
                return alert('ยังไม่ใช่ตาของคุณ!');
            }
            if(currentTurnPlayer.energy < 3) {
                return alert('Energy ไม่พอ (ต้องการ 3)');
            }

            selectedCardIndexForAttack = index;
            alert('เลือกการ์ดแล้ว! ตอนนี้ให้คลิกที่กรอบของเพื่อนด้านล่างเพื่อเลือกเป้าหมายที่จะโจมตี');
            
            // ทำให้กรอบเป้าหมายกระพริบ
            document.querySelectorAll('.target-card').forEach(el => {
                el.classList.add('flashing');
            });
        }

        // กดเลือกเป้าหมายที่กระพริบ
        function targetPlayer(targetId) {
            if (selectedCardIndexForAttack === null) {
                return alert('กรุณากดเลือก "ใช้โจมตี" ที่การ์ดในมือก่อน!');
            }

            // ส่งข้อมูลโจมตีไปหลังบ้าน
            socket.emit('initiate_attack', { targetId: targetId, cardIndex: selectedCardIndexForAttack });
            selectedCardIndexForAttack = null;

            // เอาสีกระพริบออก
            document.querySelectorAll('.target-card').forEach(el => {
                el.classList.remove('flashing');
            });
        }

        // ป๊อปอัพสำหรับผู้ถูกโจมตี (เลือกว่าจะใช้การ์ดป้องกันไหม)
        socket.on('defend_prompt', (data) => {
            const overlay = document.getElementById('modal-overlay');
            const modalBody = document.getElementById('modal-body');
            overlay.classList.remove('hidden');

            if (data.hasDefenseCard) {
                // หาอินเด็กซ์ของการ์ดป้องกันในมือตัวเอง
                const me = currentRoomData.players.find(p => p.id === myId);
                const cardIndex = me.hand.findIndex(c => c.name === 'การ์ดโจมตี/ป้องกัน');

                modalBody.innerHTML = `
                    <h3>⚠️ คุณถูก ${data.attackerName} โจมตี!</h3>
                    <p>คุณมี "การ์ดป้องกัน" ในมือ จะใช้ไหม?</p>
                    <button onclick="useDefense(${cardIndex})" style="background:#2ed573;">ใช้การ์ดป้องกัน</button>
                    <button onclick="skipDefense()">ไม่มี / ไม่ใช้</button>
                `;
            } else {
                modalBody.innerHTML = `
                    <h3>⚠️ คุณถูก ${data.attackerName} โจมตี!</h3>
                    <p style="color:#ff4757;">คุณไม่มีการ์ดป้องกันในมือ</p>
                    <button onclick="skipDefense()">ปิด / ยอมรับชะตากรรม</button>
                `;
            }
        });

        function useDefense(cardIndex) {
            document.getElementById('modal-overlay').classList.add('hidden');
            socket.emit('use_defense_card', { defenseCardIndex: cardIndex });
        }

        function skipDefense() {
            document.getElementById('modal-overlay').classList.add('hidden');
            socket.emit('skip_defense');
        }

        // ป๊อปอัพให้ผู้โจมตีทอยเต๋า
        socket.on('request_attacker_roll', (data) => {
            const overlay = document.getElementById('modal-overlay');
            const modalBody = document.getElementById('modal-body');
            overlay.classList.remove('hidden');

            modalBody.innerHTML = `
                <h3>🎲 ตาของคุณโจมตี!</h3>
                <p>กดปุ่มด้านล่างเพื่อทอยเต๋าโจมตี</p>
                <button onclick="rollDiceAndSubmit('${data.targetId}', ${data.hasDefenderRolled})" style="background:#ffa502; color:#000; font-weight:bold;">ทอยเต๋า (1-6)</button>
            `;
        });

        function rollDiceAndSubmit(targetId, hasDefenderRolled) {
            const attackerRoll = Math.floor(Math.random() * 6) + 1;
            document.getElementById('modal-overlay').classList.add('hidden');
            socket.emit('submit_attacker_roll', { targetId, attackerRoll, hasDefenderRolled });
        }

        socket.on('battle_result', (data) => {
            alert(`⚔️ ผลการต่อสู้ (${data.attackerName} vs ${data.targetName})\nผู้โจมตีทอยได้: ${data.attackerRoll}\nฝ่ายป้องกันทอยได้: ${data.targetRoll}\n💥 ดาเมจสุทธิเข้าตัว: ${data.damage}`);
            updateGameUI(data.roomState);
        });

        socket.on('game_over', (data) => {
            alert(`🎉 เกมจบแล้ว! ผู้ชนะคือ: ${data.winner}`);
            location.reload();
        });

        function updateGameUI(room) {
            currentRoomData = room;
            const me = room.players.find(p => p.id === myId);
            if(!me) return;

            document.getElementById('my-hp').innerText = me.hp;
            document.getElementById('my-energy').innerText = me.energy;

            // แสดงการ์ดในมือ
            const handDiv = document.getElementById('hand-cards');
            handDiv.innerHTML = '';
            me.hand.forEach((card, index) => {
                handDiv.innerHTML += `<div class="card"><b>${card.name}</b><br>DMG: ${card.baseDamage}<br><button onclick="selectCardToAttack(${index})" style="padding:5px; font-size:11px; margin-top:5px; background:#ff4757;">ใช้โจมตี</button></div>`;
            });

            // เช็คตาเดิน
            const currentTurnPlayer = room.players[room.currentTurnIndex];
            document.getElementById('turn-info').innerText = currentTurnPlayer.id === myId ? "🟢 ตาของคุณแล้ว!" : `⏳ ตาของ ${currentTurnPlayer.name}`;

            // รายชื่อเป้าหมายโจมตี (แปลงเป็นกล่องคลิกได้)
            const targetDiv = document.getElementById('target-list');
            targetDiv.innerHTML = '';
            room.players.forEach(p => {
                if(p.id !== myId && p.hp > 0) {
                    targetDiv.innerHTML += `
                        <div class="target-card" id="target-${p.id}" onclick="targetPlayer('${p.id}')">
                            <b>${p.name}</b><br>HP: ${p.hp}
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
