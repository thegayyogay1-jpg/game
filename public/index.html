<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game Party</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; margin: 0; padding: 10px; }
        .box { background: #2a2a2a; padding: 15px; border-radius: 8px; max-width: 450px; margin: 15px auto; border: 1px solid #444; }
        input, button { padding: 10px; margin: 5px; font-size: 15px; border-radius: 4px; border: none; }
        button { cursor: pointer; background: #ff4757; color: white; transition: 0.2s; }
        button:hover { background: #ff6b81; }
        button:disabled { background: #555; cursor: not-allowed; }

        .table-container {
            position: relative;
            width: 90vw;
            max-width: 600px;
            height: 90vw;
            max-height: 600px;
            margin: 10px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #2e5233 0%, #172d1a 100%);
            border: 10px solid #4a2e18;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .center-deck {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 95px; height: 125px;
            background: #2b3a42;
            border: 3px solid #ff4757;
            border-radius: 8px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .center-deck:active { transform: translate(-50%, -50%) scale(0.95); }

        .player-node {
            position: absolute; width: 105px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px; border-radius: 8px;
            border: 2px solid #555;
            transform: translate(-50%, -50%);
        }
        .player-node.active-turn { border-color: #2ed573; box-shadow: 0 0 10px #2ed573; }
        .targetable { border-color: #ffa502 !important; animation: glow 0.8s infinite alternate; cursor: pointer; }

        .card {
            display: inline-block; background: #fff; color: #000;
            padding: 8px; margin: 4px; border-radius: 6px;
            width: 105px; font-size: 12px;
            border: 3px solid transparent; cursor: pointer; user-select: none;
        }
        .card.magic { background: #a29bfe; color: #fff; }
        .card.fixed { background: #74b9ff; color: #000; font-weight: bold; }
        .card.selected { border-color: #ff4757; background: #ffeaa7; color:#000; transform: translateY(-5px); }

        .dice {
            display: inline-block; width: 50px; height: 50px;
            background: #fff; color: #000; font-size: 28px;
            line-height: 50px; font-weight: bold; border-radius: 8px;
            margin: 5px; box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .hidden { display: none !important; }
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 999;
        }
        .modal-content { background: #222; padding: 25px; border-radius: 12px; border: 2px solid #ff4757; width: 330px; }
        @keyframes glow { from { border-color: #ffa502; } to { border-color: #ff4757; } }
    </style>
</head>
<body>

    <h1>🃏 เกมการ์ดปาร์ตี้</h1>

    <div id="lobby-screen" class="box">
        <h3>เข้าสู่เกม</h3>
        <input type="text" id="playerName" placeholder="ชื่อของคุณ"><br>
        <input type="text" id="roomCode" placeholder="รหัสห้อง (เช่น 1234)"><br>
        <button onclick="createRoom()">สร้างห้อง</button>
        <button onclick="joinRoom()">เข้าห้อง</button>
    </div>

    <div id="waiting-screen" class="box hidden">
        <h3 id="room-title">ห้อง: -</h3>
        <p>รายชื่อผู้เล่นในห้อง:</p>
        <ul id="player-list" style="list-style: none; padding: 0;"></ul>
        <button id="start-btn" class="hidden" onclick="startGame()">เริ่มเกม</button>
    </div>

    <div id="game-screen" class="hidden">
        <h2 id="turn-info">ตาของ...</h2>
        
        <div class="table-container" id="game-table">
            <div class="center-deck" onclick="drawCard()">
                <b>🎴 กองการ์ด</b>
                <span style="font-size: 11px; color: #aaa; margin-top:4px;">(จั่ว -1 Energy)</span>
            </div>
        </div>

        <div class="box">
            <h3>สถานะ: HP <span id="my-hp">15</span> | Energy <span id="my-energy">5</span></h3>
            <h3>การ์ดในมือ</h3>
            <div id="hand-cards"></div>
            <p id="attack-hint" style="font-size: 13px; color: #ffa502;"></p>
            
            <button id="end-turn-btn" class="hidden" onclick="endTurn()" style="background: #2ed573;">จบเทิร์น</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content" id="modal-body"></div>
    </div>

    <script>
        const socket = io();
        let myId = '';
        let currentRoomData = null;
        let selectedCards = [];
        let selectedMagicCardIndex = null;

        socket.on('connect', () => { myId = socket.id; });
        socket.on('error_message', (msg) => alert(msg));
        socket.on('alert_message', (msg) => alert(msg));

        function createRoom() {
            const name = document.getElementById('playerName').value;
            const code = document.getElementById('roomCode').value;
            if(!name || !code) return alert('กรุณากรอกชื่อและรหัสห้อง');
            socket.emit('create_room', { roomCode: code, playerName: name });
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value;
            const code = document.getElementById('roomCode').value;
            if(!name || !code) return alert('กรุณากรอกชื่อและรหัสห้อง');
            socket.emit('join_room', { roomCode: code, playerName: name });
        }

        socket.on('room_joined', (room) => {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.remove('hidden');
            document.getElementById('room-title').innerText = `ห้อง: ${document.getElementById('roomCode').value}`;
            if (room.host === myId) document.getElementById('start-btn').classList.remove('hidden');
        });

        socket.on('update_room', (room) => {
            currentRoomData = room;
            updateWaitingRoom(room);
            if(room.gameStarted) updateGameUI(room);
        });

        function updateWaitingRoom(room) {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            room.players.forEach(p => {
                list.innerHTML += `<li>👤 ${p.name} ${p.id === room.host ? '(Host)' : ''}</li>`;
            });
        }

        function startGame() { socket.emit('start_game'); }

        socket.on('game_started', (room) => {
            document.getElementById('waiting-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            updateGameUI(room);
        });

        function drawCard() { 
    // ตรวจสอบว่ามีข้อมูลห้อง และผู้เล่นปัจจุบันเป็นคนเดียวกับเราหรือไม่
    if (!currentRoomData) return;
    const currentTurnPlayer = currentRoomData.players[currentRoomData.currentTurnIndex];
    
    if (currentTurnPlayer.id !== myId) {
        return alert('ยังไม่ใช่ตาของคุณ!');
    }
    
    socket.emit('draw_card'); 
    }

        function toggleSelectCard(index, type) {
            const currentTurnPlayer = currentRoomData.players[currentRoomData.currentTurnIndex];
            if(currentTurnPlayer.id !== myId) return alert('ยังไม่ใช่ตาของคุณ!');

            if (type === 'double_energy' || type === 'block_defense') {
                selectedCards = [];
                selectedMagicCardIndex = index;
                document.getElementById('attack-hint').innerText = `✨ เลือกการ์ดเวทมนตร์แล้ว (ใช้ 2 Energy) -> คลิกเลือกเป้าหมายบนโต๊ะ`;
            } else {
                selectedMagicCardIndex = null;
                const pos = selectedCards.indexOf(index);
                if (pos > -1) {
                    selectedCards.splice(pos, 1);
                } else {
                    if (selectedCards.length >= 2) return alert('เลือกการ์ดโจมตีได้สูงสุด 2 ใบเท่านั้น');
                    selectedCards.push(index);
                }

                const cost = selectedCards.length === 2 ? 5 : (selectedCards.length === 1 ? 3 : 0);
                const hint = document.getElementById('attack-hint');
                if(selectedCards.length > 0) {
                    hint.innerText = `⚔️ เลือกการ์ดโจมตี ${selectedCards.length} ใบ (ใช้ ${cost} Energy) -> คลิกเลือกเป้าหมายบนโต๊ะ`;
                } else {
                    hint.innerText = '';
                }
            }

            const me = currentRoomData.players.find(p => p.id === myId);
            updateHandUI(me);
            updateTableUI(currentRoomData);
        }

        function targetPlayer(targetId) {
            const me = currentRoomData.players.find(p => p.id === myId);

            if (selectedMagicCardIndex !== null) {
                if (me.energy < 2) return alert('Energy ไม่พอ (ต้องการ 2)');
                socket.emit('use_magic_card', { targetId, cardIndex: selectedMagicCardIndex });
                selectedMagicCardIndex = null;
            } else if (selectedCards.length > 0) {
                if (targetId === myId) return alert('ไม่สามารถโจมตีตัวเองได้!');
                const cost = selectedCards.length === 2 ? 5 : 3;
                if (me.energy < cost) return alert(`Energy ไม่พอ (ต้องการ ${cost})`);

                socket.emit('initiate_attack', { targetId, cardIndices: selectedCards });
                selectedCards = [];
            } else {
                return alert('กรุณาเลือกการ์ดในมือก่อน!');
            }

            document.getElementById('attack-hint').innerText = '';
        }

        function showModal() { document.getElementById('modal-overlay').style.display = 'flex'; }
        function hideModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        // ป๊อปอัพโดนคำสาปไร้เกราะ
        socket.on('curse_blocked_alert', (data) => {
            const modalBody = document.getElementById('modal-body');
            showModal();
            modalBody.innerHTML = `
                <h3>🔮 คำสาปทำงาน!</h3>
                <p style="color:#ff4757; font-weight:bold;">✨ ยินดีด้วย! คุณโดนเวทมนตร์คำสาปบล็อคการป้องกัน จึงไม่สามารถใช้การ์ดป้องกันได้!</p>
                <p>เตรียมรับการโจมตีจาก <b>${data.attackerName}</b></p>
                <button onclick="hideModal()" style="background:#ff4757;">รับชะตากรรม</button>
            `;
        });

        socket.on('defend_prompt', (data) => {
            const modalBody = document.getElementById('modal-body');
            showModal();

            if (data.hasDefenseCard) {
                const me = currentRoomData.players.find(p => p.id === myId);
                const cardIndex = me.hand.findIndex(c => c.type === 'attack_defend' || c.type === 'fixed_value');
                const card = me.hand[cardIndex];

                modalBody.innerHTML = `
                    <h3>⚠️ ถูก ${data.attackerName} โจมตี!</h3>
                    <p>คุณมี <b>"${card.name}"</b> จะใช้ป้องกันหรือไม่?</p>
                    <button onclick="useDefense(${cardIndex})" style="background:#2ed573;">ใช้การ์ดป้องกัน</button>
                    <button onclick="skipDefense()">ยอมรับการโจมตี</button>
                `;
            } else {
                modalBody.innerHTML = `
                    <h3>⚠️ ถูก ${data.attackerName} โจมตี!</h3>
                    <p style="color:#ff4757;">คุณไม่มีการ์ดป้องกันในมือ</p>
                    <button onclick="skipDefense()">รับการโจมตี</button>
                `;
            }
        });

        function useDefense(cardIndex) {
            hideModal();
            socket.emit('use_defense_card', { defenseCardIndex: cardIndex });
        }

        function skipDefense() {
            hideModal();
            socket.emit('skip_defense');
        }

        socket.on('request_attacker_roll', (data) => {
            const modalBody = document.getElementById('modal-body');
            showModal();

            let diceHTML = '';
            for(let i = 0; i < data.diceCount; i++) {
                diceHTML += `<div class="dice" id="att-dice-${i}">?</div>`;
            }

            let fixedText = data.fixedSum > 0 ? `<p style="color:#74b9ff;">➕ มีแต้มล็อคคงที่ติดมาด้วย: +${data.fixedSum}</p>` : '';

            modalBody.innerHTML = `
                <h3>🎲 ทอยเต๋าโจมตี (${data.diceCount} ลูก)</h3>
                <div>${diceHTML}</div>
                ${fixedText}<br>
                <button id="roll-btn" onclick="animateAndRollAttacker(${data.diceCount})" style="background:#ffa502; color:#000; font-weight:bold;">เริ่มทอยเต๋า!</button>
            `;
        });

        function animateAndRollAttacker(count) {
            document.getElementById('roll-btn').disabled = true;
            let rolls = [];
            let counter = 0;

            const interval = setInterval(() => {
                for(let i = 0; i < count; i++) {
                    document.getElementById(`att-dice-${i}`).innerText = Math.floor(Math.random() * 6) + 1;
                }
                counter++;
                if(counter > 12) {
                    clearInterval(interval);
                    for(let i = 0; i < count; i++) {
                        const finalVal = Math.floor(Math.random() * 6) + 1;
                        document.getElementById(`att-dice-${i}`).innerText = finalVal;
                        rolls.push(finalVal);
                    }
                    setTimeout(() => {
                        hideModal();
                        socket.emit('submit_attacker_roll', { rolls });
                    }, 800);
                }
            }, 80);
        }

        socket.on('request_defender_roll', () => {
            const modalBody = document.getElementById('modal-body');
            showModal();

            modalBody.innerHTML = `
                <h3>🛡️ ทอยเต๋าป้องกัน!</h3>
                <div><div class="dice" id="def-dice">?</div></div><br>
                <button id="roll-def-btn" onclick="animateAndRollDefender()" style="background:#2ed573; color:#000; font-weight:bold;">ทอยเต๋าลดดาเมจ!</button>
            `;
        });

        function animateAndRollDefender() {
            document.getElementById('roll-def-btn').disabled = true;
            let counter = 0;

            const interval = setInterval(() => {
                document.getElementById('def-dice').innerText = Math.floor(Math.random() * 6) + 1;
                counter++;
                if(counter > 12) {
                    clearInterval(interval);
                    const finalVal = Math.floor(Math.random() * 6) + 1;
                    document.getElementById('def-dice').innerText = finalVal;
                    setTimeout(() => {
                        hideModal();
                        socket.emit('submit_defender_roll', { roll: finalVal });
                    }, 800);
                }
            }, 80);
        }

        socket.on('battle_result', (data) => {
            const attRollSum = data.attackerRolls.reduce((a, b) => a + b, 0);
            const attRollStr = data.attackerRolls.join(' + ');
            alert(`⚔️ ผลการต่อสู้ (${data.attackerName} vs ${data.targetName})\n🎲 ฝ่ายโจมตีได้แต้ม: ${attRollStr} (รวม ${attRollSum})\n🛡️ ฝ่ายป้องกันได้แต้ม: ${data.targetRoll}\n💥 ดาเมจสุทธิ (${attRollSum} - ${data.targetRoll}): ${data.damage}`);
            updateGameUI(data.roomState);
        });

        socket.on('game_over', (data) => {
            alert(`🎉 เกมจบแล้ว! ผู้ชนะคือ: ${data.winner}`);
            location.reload();
        });

        function updateGameUI(room) {
            currentRoomData = room;
            const me = room.players.find(p => p.id === myId);
            if(!me) return;

            document.getElementById('my-hp').innerText = me.hp;
            // เจ้าของเทิร์นเห็น Energy จริงของตัวเอง
            document.getElementById('my-energy').innerText = me.energy;

            const currentTurnPlayer = room.players[room.currentTurnIndex];
            const isMyTurn = currentTurnPlayer.id === myId;

            document.getElementById('turn-info').innerText = isMyTurn ? "🟢 ตาของคุณแล้ว!" : `⏳ ตาของ ${currentTurnPlayer.name}`;

            const endBtn = document.getElementById('end-turn-btn');
            if (isMyTurn) {
                endBtn.classList.remove('hidden');
            } else {
                endBtn.classList.add('hidden');
            }

            updateHandUI(me);
            updateTableUI(room);
        }

        function updateHandUI(me) {
            const handDiv = document.getElementById('hand-cards');
            handDiv.innerHTML = '';
            me.hand.forEach((card, index) => {
                const isSelected = (selectedCards.includes(index) || selectedMagicCardIndex === index) ? 'selected' : '';
                let cardClass = '';
                if (card.type === 'double_energy' || card.type === 'block_defense') cardClass = 'magic';
                if (card.type === 'fixed_value') cardClass = 'fixed';

                handDiv.innerHTML += `
                    <div class="card ${cardClass} ${isSelected}" onclick="toggleSelectCard(${index}, '${card.type}')">
                        <b>${card.name}</b>
                    </div>
                `;
            });
        }

        function updateTableUI(room) {
            const table = document.getElementById('game-table');
            document.querySelectorAll('.player-node').forEach(e => e.remove());

            const players = room.players;
            const total = players.length;
            const currentTurnPlayer = players[room.currentTurnIndex];
            const myIndex = players.findIndex(p => p.id === myId);

            players.forEach((p, i) => {
                const relativeIndex = (i - myIndex + total) % total;
                const angle = (relativeIndex / total) * 2 * Math.PI + (Math.PI / 2); 
                
                const radius = 38; 
                const x = 50 + radius * Math.cos(angle);
                const y = 50 + radius * Math.sin(angle);

                const isTurn = p.id === currentTurnPlayer.id ? 'active-turn' : '';
                
                let isTargetable = false;
                if (selectedMagicCardIndex !== null && p.hp > 0) {
                    isTargetable = true;
                } else if (selectedCards.length > 0 && p.id !== myId && p.hp > 0) {
                    isTargetable = true;
                }

                const targetClass = isTargetable ? 'targetable' : '';

                // ผู้เล่นอื่นจะเห็นค่า visibleEnergy (ไม่ลดทันทีจนกว่าจะจบเทิร์น)
                const displayEnergy = (p.id === myId) ? p.energy : p.visibleEnergy;

                const node = document.createElement('div');
                node.className = `player-node ${isTurn} ${targetClass}`;
                node.style.left = `${x}%`;
                node.style.top = `${y}%`;
                if(isTargetable) node.onclick = () => targetPlayer(p.id);

                node.innerHTML = `
                    <div style="font-size:12px; font-weight:bold;">${p.name}</div>
                    <div style="font-size:11px; color:#ff4757;">HP: ${p.hp}</div>
                    <div style="font-size:10px; color:#2ed573;">NRG: ${displayEnergy}</div>
                `;
                table.appendChild(node);
            });
        }
    </script>
</body>
</html>
